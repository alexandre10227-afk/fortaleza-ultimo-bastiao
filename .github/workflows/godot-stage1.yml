name: Godot Stage 1 QA and Source Package
on:
  push:
    paths:
      - 'novo_projeto/**'
      - '.github/workflows/godot-stage1.yml'
  pull_request:
    paths:
      - 'novo_projeto/**'
      - '.github/workflows/godot-stage1.yml'
  workflow_dispatch:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path novo_projeto --editor --import --quit 2>&1 | tee /tmp/godot_import.txt
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Compile Error:' /tmp/godot_import.txt; then exit 1; fi
      - name: Automated regression suite (fail fast)
        shell: bash
        run: |
          set -uo pipefail
          for test in novo_projeto/tests/test_*.gd; do
            echo "::group::$(basename "$test")"
            log="/tmp/$(basename "$test").log"
            status=0
            timeout --signal=TERM --kill-after=2s 12s godot --headless --path novo_projeto --script "res://tests/$(basename "$test")" >"$log" 2>&1 || status=$?
            cat "$log"
            echo "::endgroup::"
            if [[ "$status" -ne 0 ]] || grep -Eq 'SCRIPT ERROR:|Parse Error:|Assertion failed|Failed to load script|Invalid access|Attempt to call' "$log" || ! grep -q 'PASS' "$log"; then
              echo "::error::Test $(basename "$test") failed, timed out, or did not print PASS"
              exit 1
            fi
          done
      - name: Scene smoke test
        shell: bash
        run: |
          timeout 30s godot --headless --path novo_projeto --quit-after 5 2>&1 | tee /tmp/godot_scene.txt
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Compile Error:' /tmp/godot_scene.txt; then exit 1; fi
      - name: Source package for Windows acceptance
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path("novo_projeto")
          dest=Path("dist/Fortaleza_Etapa1_Projeto_Godot_Teste.zip")
          with ZipFile(dest,"w",ZIP_DEFLATED,compresslevel=7) as z:
              for f in sorted(root.rglob("*")):
                  if not f.is_file() or ".godot" in f.parts or "__pycache__" in f.parts:
                      continue
                  z.write(f,f.as_posix())
          print(f"Package: {dest} ({dest.stat().st_size} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortaleza-etapa1-projeto-godot
          path: dist/Fortaleza_Etapa1_Projeto_Godot_Teste.zip
          retention-days: 30
